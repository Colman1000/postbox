<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Postbox — mail on your own domain." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Installable. The manifest is generated by the Worker rather than served
      as a file, because the icon and the name under it are the mailbox's to
      choose — see src/worker/routes/icon.ts.

      `apple-touch-icon` is separate and not optional: iOS ignores the
      manifest's icons when adding to the Home Screen, and falls back to a
      screenshot of the page if this is missing.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- The status bar draws over the page, which is what `viewport-fit=cover`
         above is already accounting for. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Postbox</title>
    <script>
      // Applied before first paint so the app never flashes the wrong theme or
      // the wrong brand colour. Both are mirrored into localStorage for exactly
      // this reason; the mailbox still holds the brand colour of record.
      (() => {
        try {
          const stored = localStorage.getItem("postbox:theme");
          const dark =
            stored === "dark" ||
            (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);

          const brand = localStorage.getItem("postbox:brand");
          if (brand && /^#[0-9a-f]{6}$/i.test(brand)) {
            document.documentElement.style.setProperty("--brand", brand);
            document.documentElement.dataset.brand = "";
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
